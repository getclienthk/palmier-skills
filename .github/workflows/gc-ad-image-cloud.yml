name: gc-ad-image cloud setup

# Proves cloud/setup.sh works on a clean Ubuntu box (same family as Codex Cloud's
# universal image) and renders both templates so the output can be eyeballed.
on:
  push:
    paths:
      - "cloud/**"
      - "skills/gc-ad-image/**"
      - ".github/workflows/gc-ad-image-cloud.yml"
  workflow_dispatch:

jobs:
  setup-and-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run cloud/setup.sh against this checkout
        env:
          GC_SKILLS_DIR: ${{ github.workspace }}
          GC_SKILLS_SKIP_CLONE: "1"
        run: bash cloud/setup.sh
      - name: Skill is linked where Codex looks
        run: test -f "$HOME/.codex/skills/gc-ad-image/SKILL.md" && test -f "$HOME/.agents/skills/gc-ad-image/SKILL.md"
      - name: Render both templates with a placeholder photo
        run: |
          set -e
          OUT="$RUNNER_TEMP/render"; mkdir -p "$OUT"
          K=skills/gc-ad-image
          cp $K/templates/*.html "$OUT/"
          python3 - "$OUT" <<'PY'
          import sys, struct, zlib
          # plain grey PNG stand-in for the coach photo (no real faces in a public repo)
          def png(path, w, h, rgb):
              raw = b"".join(b"\x00" + bytes(rgb) * w for _ in range(h))
              def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d))
              data = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
              open(path, "wb").write(data)
          png(sys.argv[1] + "/photo.jpg", 400, 900, (90, 88, 84))
          png(sys.argv[1] + "/photo.png", 400, 900, (40, 70, 60))
          PY
          node $K/scripts/render-html.mjs "$OUT/event-poster.html" "$OUT/event-poster.png" 1080 1080
          node $K/scripts/render-html.mjs "$OUT/reply-card.html" "$OUT/reply-card.png" 1080 1080
          printf '{"background":"%s","output":"%s","preset":"thumb","headline":"3個月 [[收生翻倍]]","sub":"導師親身拆解"}' "$OUT/photo.png" "$OUT/thumb.png" > "$OUT/thumb.json"
          node $K/scripts/render-overlay.mjs "$OUT/thumb.json"
          ls -la "$OUT"
          fc-match "Noto Serif CJK TC"; fc-match "Noto Sans CJK TC"
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ${{ runner.temp }}/render/*.png

  # Bare box: root user, no Chrome, no sudo, no runner niceties (closest to a fresh Codex Cloud container).
  bare-container:
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Run cloud/setup.sh (must install Chromium itself)
        env:
          GC_SKILLS_DIR: ${{ github.workspace }}
          GC_SKILLS_SKIP_CLONE: "1"
        run: |
          command -v google-chrome || echo "no system chrome (expected)"
          bash cloud/setup.sh
      - name: Clone-from-GitHub path (what Codex Cloud will actually run)
        env:
          GC_SKILLS_REF: ${{ github.ref_name }}
          GC_SKILLS_DIR: /root/gc-skills-clone
        run: bash cloud/setup.sh
      - name: Broken first browser falls through to a working one
        env:
          CHROME_PATH: /bin/false
        run: |
          D=$(mktemp -d); cp skills/gc-ad-image/templates/reply-card.html "$D/"
          node skills/gc-ad-image/scripts/render-html.mjs "$D/reply-card.html" "$D/out.png" 1080 1080
          test -s "$D/out.png"
